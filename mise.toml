# CLI tools. Linked to ~/.config/mise/config.toml.
# Install: mise install    Update: mise upgrade
# These track "latest". Language runtimes belong in a project's own mise.toml.

[tools]
neovim = "latest"
ripgrep = "latest"
fzf = "latest"
bat = "latest"
eza = "latest"
zoxide = "latest"
lazygit = "latest"
lazydocker = "latest"
usage = "latest"        # completion backend used by some mise tools
btop = "latest"
# opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
