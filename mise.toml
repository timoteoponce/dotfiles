# Pinned tool + runtime layer. Linked to ~/.config/mise/config.toml.
# Install / update everything: mise install   (or: mise upgrade)

[tools]
neovim = "latest"
ripgrep = "latest"
fzf = "latest"
bat = "latest"
eza = "latest"
delta = "latest"       # git-delta; binary is still `delta`
zoxide = "latest"
lazygit = "latest"
lazydocker = "latest"
usage = "latest"        # completion backend used by some mise tools

# Language runtimes. Per-project versions still win via a local
# .mise.toml / .tool-versions.
java = "adoptopenjdk-25.0.1+8.0.LTS"
clojure = "1.12.4"
ruby = "3.3.6"
# node = "lts"
# python = "3.12"
# go = "latest"
